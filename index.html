<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Жестко фиксируем масштаб для телефонов -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reader</title>
  <style>
    /* ============================================================
       iOS 26 - Reader (14 Комфортных тем + Мульти-закладки)
       ============================================================ */

    /* --- СВЕТЛЫЕ И ТЁПЛЫЕ ТЕМЫ --- */
    :root, html[data-theme="cream"] { --bg: #F8F5EE; --bg-elev: #EAE4D3; --text: #2B2A27; --text-secondary: #595854; --text-tertiary: #8C8A85; --separator: rgba(43, 42, 39, 0.12); --accent: #D97706; --glass-bg: rgba(248, 245, 238, 0.85); --glass-border: rgba(255, 255, 255, 0.5); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); --content-font-size: 19px; }
    html[data-theme="sepia"] { --bg: #EAE0D0; --bg-elev: #D8CCBA; --text: #3C2F2F; --text-secondary: #6B5B5B; --text-tertiary: #8A7A7A; --separator: rgba(60, 47, 47, 0.15); --accent: #B45309; --glass-bg: rgba(234, 224, 208, 0.85); --glass-border: rgba(255, 255, 255, 0.3); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); }
    html[data-theme="gray"] { --bg: #E5E5EA; --bg-elev: #D1D1D6; --text: #2C2C2E; --text-secondary: #48484A; --text-tertiary: #8E8E93; --separator: rgba(44, 44, 46, 0.12); --accent: #007AFF; --glass-bg: rgba(229, 229, 234, 0.85); --glass-border: rgba(255, 255, 255, 0.4); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06); }
    html[data-theme="mint"] { --bg: #E3F2ED; --bg-elev: #CBE6DC; --text: #253930; --text-secondary: #4A6357; --text-tertiary: #758C81; --separator: rgba(37, 57, 48, 0.12); --accent: #10B981; --glass-bg: rgba(227, 242, 237, 0.85); --glass-border: rgba(255, 255, 255, 0.5); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); }
    html[data-theme="olive"] { --bg: #E8EBE4; --bg-elev: #D6DCD0; --text: #2D3328; --text-secondary: #586350; --text-tertiary: #84937A; --separator: rgba(45, 51, 40, 0.12); --accent: #657954; --glass-bg: rgba(232, 235, 228, 0.85); --glass-border: rgba(255, 255, 255, 0.4); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); }
    html[data-theme="peach"] { --bg: #FDF6E3; --bg-elev: #F7EAD0; --text: #4A3B32; --text-secondary: #7A665A; --text-tertiary: #A69285; --separator: rgba(74, 59, 50, 0.12); --accent: #D97706; --glass-bg: rgba(253, 246, 227, 0.85); --glass-border: rgba(255, 255, 255, 0.5); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); }
    html[data-theme="parchment"] { --bg: #F5EEDB; --bg-elev: #E8DFC5; --text: #382A1D; --text-secondary: #63503D; --text-tertiary: #8C7A65; --separator: rgba(56, 42, 29, 0.12); --accent: #A86024; --glass-bg: rgba(245, 238, 219, 0.85); --glass-border: rgba(255, 255, 255, 0.4); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06); }

    /* --- ТЁМНЫЕ И ВЕЧЕРНИЕ ТЕМЫ --- */
    html[data-theme="coffee"] { --bg: #3E2F2B; --bg-elev: #2C201D; --text: #E6DEDD; --text-secondary: #BFAEA9; --text-tertiary: #8C7C77; --separator: rgba(230, 222, 221, 0.15); --accent: #FBBF24; --glass-bg: rgba(62, 47, 43, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
    html[data-theme="night"] { --bg: #0F172A; --bg-elev: #1E293B; --text: #CBD5E1; --text-secondary: #94A3B8; --text-tertiary: #64748B; --separator: rgba(203, 213, 225, 0.15); --accent: #38BDF8; --glass-bg: rgba(15, 23, 42, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    html[data-theme="dark"] { --bg: #1A1A1A; --bg-elev: #262626; --text: #D4D4D4; --text-secondary: #A3A3A3; --text-tertiary: #737373; --separator: rgba(212, 212, 212, 0.15); --accent: #0A84FF; --glass-bg: rgba(26, 26, 26, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
    html[data-theme="lavender"] { --bg: #1E1B33; --bg-elev: #2A2645; --text: #D6D3E8; --text-secondary: #A29DB8; --text-tertiary: #7A7596; --separator: rgba(214, 211, 232, 0.12); --accent: #A78BFA; --glass-bg: rgba(30, 27, 51, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    html[data-theme="slate"] { --bg: #1E2329; --bg-elev: #2C333A; --text: #D0D5DB; --text-secondary: #9AA3AF; --text-tertiary: #697482; --separator: rgba(208, 213, 219, 0.12); --accent: #38BDF8; --glass-bg: rgba(30, 35, 41, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    html[data-theme="forest"] { --bg: #131E18; --bg-elev: #1C2B22; --text: #C4D4CB; --text-secondary: #8DA899; --text-tertiary: #5D7A69; --separator: rgba(196, 212, 203, 0.12); --accent: #4ADE80; --glass-bg: rgba(19, 30, 24, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    html[data-theme="ocean"] { --bg: #0B192C; --bg-elev: #142842; --text: #C7D7EC; --text-secondary: #85A3C7; --text-tertiary: #52759E; --separator: rgba(199, 215, 236, 0.12); --accent: #60A5FA; --glass-bg: rgba(11, 25, 44, 0.85); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
      overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease;
      touch-action: pan-y; /* Запрет щипка/зума на многих браузерах */
    }

    body { display: flex; flex-direction: column; min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

    .glass {
      background: var(--glass-bg); backdrop-filter: saturate(180%) blur(28px); -webkit-backdrop-filter: saturate(180%) blur(28px);
      border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    }

    /* ----------------- Top bar ----------------- */
    .topbar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 50; width: min(640px, calc(100% - 24px)); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 9999px; min-height: 52px; }
    
    .title-block { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; flex: 1; text-align: center; }
    .title { font-weight: 600; font-size: 15px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9999px;
      border: none; background: transparent; color: var(--text); cursor: pointer; transition: 0.2s ease; flex-shrink: 0;
      font-weight: 700; font-size: 16px;
    }
    .icon-btn:hover { background: var(--separator); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; }
    
    .font-controls { display: flex; gap: 4px; }

    /* ----------------- Reader area ----------------- */
    .reader { flex: 1; display: flex; justify-content: center; padding: 92px 20px 120px; position: relative; }
    
    /* Динамический размер шрифта */
    .content { width: 100%; max-width: 680px; color: var(--text); font-family: "Georgia", "Merriweather", serif; font-size: var(--content-font-size); line-height: 1.7; }
    
    .fb2-cover { display: flex; justify-content: center; margin: 12px 0 32px; }
    .fb2-cover img { max-width: 260px; width: 100%; height: auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .fb2-book-header { text-align: center; margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid var(--separator); font-family: sans-serif; }
    .fb2-book-title { font-size: 1.6em; font-weight: 700; margin: 0 0 8px; line-height: 1.15; }
    
    .fb2-title { font-family: sans-serif; font-weight: 700; line-height: 1.2; margin: 32px 0 16px; }
    h1.fb2-title { font-size: 1.4em; margin-top: 48px; } h2.fb2-title { font-size: 1.2em; margin-top: 36px; }
    .fb2-title p, .fb2-subtitle + p, .fb2-book-header + p, .fb2-section > p:first-child { text-indent: 0; }
    .content p { margin: 0; text-indent: 1.5em; hyphens: auto; }

    .fb2-epigraph { margin: 24px 0 24px auto; padding: 0 0 0 16px; border-left: 2px solid var(--separator); font-style: italic; color: var(--text-secondary); max-width: 75%; }
    .fb2-cite { margin: 20px 16px; padding: 14px 18px; background: var(--bg-elev); border-radius: 14px; color: var(--text-secondary); }
    .fb2-image { display: block; max-width: 100%; height: auto; margin: 24px auto; border-radius: 14px; }
    
    /* ----------------- Loading & Error ----------------- */
    .loading, .error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 40; }
    .loading { flex-direction: column; gap: 14px; background: var(--bg); pointer-events: none; }
    .loading[hidden], .error[hidden] { display: none; }
    .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--separator); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ----------------- Bottom nav (Bookmarks) ----------------- */
    .navbar { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 50; }
    .navbar-inner { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 9999px; height: 56px; min-width: 240px; }
    .page-indicator { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px 12px; border-radius: 20px; transition: 0.2s; font-family: sans-serif; font-weight: 600; font-size: 15px;}
    .page-indicator:active { background: var(--separator); }
    
    /* ----------------- Modals & Toolbars ----------------- */
    .selection-toolbar { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 72px); transform: translate(-50%, 16px); z-index: 60; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .selection-toolbar.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .selection-toolbar[hidden] { display: none; }
    .action-pill { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 9999px; border: none; background: var(--accent); color: #fff; font-family: sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0, 0.2); }
    .action-pill svg { width: 18px; height: 18px; }

    .toast { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 80px); transform: translate(-50%, 20px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .toast[hidden] { display: none; }
    .toast-inner { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 9999px; font-family: sans-serif; font-size: 15px; font-weight: 600; }
    
    .bookmark-highlight { background-color: var(--accent); border-radius: 4px; opacity: 0.35; padding: 1px 2px; margin: 0 -2px; }
    .bookmark-highlight.bookmark-pulse { animation: bookmarkPulse 1.6s ease; }
    @keyframes bookmarkPulse { 0% { box-shadow: 0 0 0 0px rgba(0,0,0, 0.5); } 20% { box-shadow: 0 0 0 10px rgba(0,0,0, 0.0); } 100% { box-shadow: 0 0 0 0px rgba(0,0,0, 0); } }
    ::selection { background: var(--separator); color: inherit; }

    /* ----------------- Modals (Book List & Bookmark List) ----------------- */
    .modal { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; transition: 0.3s ease; }
    .modal[hidden] { opacity: 0; pointer-events: none; transform: translateY(20px); }
    .modal-header { display: flex; justify-content: space-between; padding: 20px 24px; align-items: center; border-bottom: 1px solid var(--separator); }
    .modal-header h2 { margin: 0; font-size: 22px; font-family: sans-serif; }
    
    .book-list { flex: 1; overflow-y: auto; padding: 10px 24px 24px; }
    .book-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--separator); cursor: pointer; border-radius: 12px; margin-bottom: 8px; transition: 0.2s; }
    .book-item:active { background: var(--bg-elev); }
    .book-title { font-weight: 600; font-size: 16px; font-family: sans-serif; display: flex; align-items: center; gap: 10px; }

    /* Специфично для списка закладок */
    .bm-preview { font-size: 15px; font-family: "Georgia", serif; color: var(--text); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex: 1; }
    .bm-date { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; font-family: sans-serif;}
    .bm-delete { color: #FF3B30; font-size: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: transparent; cursor: pointer;}
    .bm-delete:active { background: rgba(255, 59, 48, 0.1); }

    /* Окно подтверждения удаления */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .confirm-overlay[hidden] { display: none; }
    .confirm-box { background: var(--bg-elev); padding: 20px; border-radius: 16px; width: 280px; text-align: center; font-family: sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .confirm-text { font-size: 16px; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 10px; }
    .confirm-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .btn-cancel { background: var(--separator); color: var(--text); }
    .btn-danger { background: #FF3B30; color: #fff; }
  </style>
</head>
<body>

  <!-- Меню списка книг -->
  <div id="bookMenu" class="modal" hidden>
    <div class="modal-header">
      <h2>📚 Библиотека</h2>
      <button id="closeBookMenu" class="icon-btn" style="background: var(--bg-elev);">✕</button>
    </div>
    <div class="book-list" id="bookList"></div>
  </div>

  <!-- Меню списка закладок -->
  <div id="bookmarkMenu" class="modal" hidden>
    <div class="modal-header">
      <h2>📍 Мои закладки</h2>
      <button id="closeBookmarkMenu" class="icon-btn" style="background: var(--bg-elev);">✕</button>
    </div>
    <div class="book-list" id="bookmarkList"></div>
  </div>

  <!-- Окно подтверждения удаления закладки -->
  <div id="confirmDelete" class="confirm-overlay" hidden>
    <div class="confirm-box">
      <div class="confirm-text">Удалить эту закладку?</div>
      <div class="confirm-btns">
        <button class="confirm-btn btn-cancel" id="btnCancelDelete">Отмена</button>
        <button class="confirm-btn btn-danger" id="btnConfirmDelete">Удалить</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-inner glass">
      <button class="icon-btn" id="openMenuBtn" aria-label="Список книг">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      </button>
      
      <div class="title-block">
        <div class="title" id="bookTitle">Загрузка...</div>
      </div>
      
      <div class="font-controls">
        <button class="icon-btn" id="fontMinus">A-</button>
        <button class="icon-btn" id="fontPlus">A+</button>
      </div>

      <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.02 0 1.95-.39 2.66-1.04.59-.53.94-1.31.94-2.12 0-.3-.08-.59-.22-.85-.16-.31-.24-.65-.24-1 0-1.1.9-2 2-2h1.86c2.21 0 4-1.79 4-4 0-5.52-4.48-10-10-10z"/></svg>
      </button>
    </div>
  </header>

  <main class="reader" id="reader">
    <article class="content" id="content"></article>
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div class="error" id="error" hidden>
      <div class="error-card glass">
        <div class="error-title">Книга не найдена</div>
        <div class="error-sub">Выберите книгу из библиотеки (иконка слева сверху).</div>
      </div>
    </div>
  </main>

  <nav class="navbar">
    <div class="navbar-inner glass">
      <button class="icon-btn" id="prevBmBtn" aria-label="Предыдущая закладка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      
      <!-- Центральная кнопка для открытия списка закладок -->
      <div class="page-indicator" id="openBookmarksBtn">
        Закладок: <span id="bmCount" style="margin-left: 6px;">0</span>
      </div>
      
      <button class="icon-btn" id="nextBmBtn" aria-label="Следующая закладка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </nav>

  <div class="selection-toolbar" id="selectionToolbar" hidden>
    <button class="action-pill" id="bookmarkBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h7A1.5 1.5 0 0 1 17 3.5V21a.5.5 0 0 1-.79.407L12 18.36l-4.21 3.047A.5.5 0 0 1 7 21V3.5z"/></svg>
      <span>Сделать закладку</span>
    </button>
  </div>

  <div class="toast" id="toast" hidden>
    <div class="toast-inner glass"><span id="toastText">Уведомление</span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module">
    // ============================================================
    // Инициализация книги & Авто-загрузка последней книги
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    let requestedBook = urlParams.get('book');

    if (!requestedBook) {
      const lastBook = localStorage.getItem('reader.lastBook');
      if (lastBook) {
        window.location.replace(`?book=${encodeURIComponent(lastBook)}`);
      }
    } else {
      localStorage.setItem('reader.lastBook', requestedBook);
    }

    const actualBookName = requestedBook || "book.fb2";
    const BOOK = {
      candidates: [`Books/${actualBookName}`],
      fallbackTitle: "Книга",
      storageKey: `reader.fb2.${actualBookName}`,
    };

    const $ = (id) => document.getElementById(id);
    const contentEl = $("content"), loadingEl = $("loading"), errorEl = $("error");
    const themeToggle = $("themeToggle"), bookTitle = $("bookTitle");
    const selectionToolbar = $("selectionToolbar"), bookmarkBtn = $("bookmarkBtn");
    const toast = $("toast"), toastText = $("toastText");

    // ============================================================
    // Размер шрифта
    // ============================================================
    let currentFontSize = parseInt(localStorage.getItem('reader.fontSize')) || 19;
    const setFontSize = (size) => {
      currentFontSize = size;
      document.documentElement.style.setProperty('--content-font-size', size + 'px');
      localStorage.setItem('reader.fontSize', size);
    };
    setFontSize(currentFontSize);
    $('fontMinus').onclick = () => setFontSize(Math.max(12, currentFontSize - 2));
    $('fontPlus').onclick = () => setFontSize(Math.min(40, currentFontSize + 2));

    // ============================================================
    // Темы (14 режимов)
    // ============================================================
    const themes = ["cream", "sepia", "gray", "mint", "olive", "peach", "parchment", "coffee", "night", "dark", "lavender", "slate", "forest", "ocean"];
    const THEME_KEY = "reader.theme";

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved && themes.includes(saved)) { document.documentElement.setAttribute("data-theme", saved); return; }
      document.documentElement.setAttribute("data-theme", "cream");
    }

    themeToggle.addEventListener("click", () => {
      let currentIdx = themes.indexOf(document.documentElement.getAttribute("data-theme") || "cream");
      currentIdx = (currentIdx + 1) % themes.length;
      const next = themes[currentIdx];
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
    });
    initTheme();

    // ============================================================
    // Меню Библиотеки
    // ============================================================
    const openMenuBtn = $("openMenuBtn"), bookMenu = $("bookMenu"), closeBookMenu = $("closeBookMenu"), bookList = $("bookList");
    
    async function openBookMenu() {
      bookMenu.hidden = false;
      bookList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">Ищем книги...</div>`;
      
      let host = window.location.hostname, user = host.split('.')[0], repo = window.location.pathname.split('/')[1] || "Reader";
      let books = [actualBookName];
      if (host.includes("github.io")) {
        try {
          const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/Books`);
          if (res.ok) books = (await res.json()).filter(f => f.name.endsWith('.fb2') || f.name.endsWith('.zip')).map(f => f.name);
        } catch (e) { console.error(e); }
      }

      bookList.innerHTML = "";
      books.forEach(bookName => {
        const div = document.createElement("div"); div.className = "book-item";
        div.innerHTML = `<div class="book-title">📘 ${bookName.replace('.fb2', '')}</div>`;
        div.onclick = () => { window.location.href = `?book=${encodeURIComponent(bookName)}`; };
        bookList.appendChild(div);
      });
    }
    openMenuBtn.addEventListener("click", openBookMenu);
    closeBookMenu.addEventListener("click", () => { bookMenu.hidden = true; });

    // ============================================================
    // Чтение и парсинг FB2
    // ============================================================
    async function fetchBook() {
      let lastErr;
      for (const url of BOOK.candidates) {
        try {
          const res = await fetch(url);
          if (!res.ok) { lastErr = new Error(`${res.status}`); continue; }
          if (url.toLowerCase().endsWith(".zip")) {
            const blob = await res.blob(), zip = await JSZip.loadAsync(blob);
            const fb2Name = Object.keys(zip.files).find((n) => n.toLowerCase().endsWith(".fb2"));
            if (!fb2Name) { lastErr = new Error("no .fb2 inside zip"); continue; }
            return await zip.files[fb2Name].async("string");
          }
          return decodeText(await res.arrayBuffer());
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("not found");
    }

    function decodeText(buf) {
      const u8 = new Uint8Array(buf);
      if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder("utf-8").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder("utf-16le").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder("utf-16be").decode(buf);
      const head = new TextDecoder("ascii", { fatal: false }).decode(new Uint8Array(buf, 0, Math.min(256, buf.byteLength)));
      const m = head.match(/encoding\s*=\s*["']([^"']+)["']/i);
      let enc = (m ? m[1] : "utf-8").toLowerCase().replace(/_/g, "-");
      if (enc === "cp1251" || enc === "win-1251") enc = "windows-1251";
      try { return new TextDecoder(enc, { fatal: false }).decode(buf); } catch { return new TextDecoder("utf-8").decode(buf); }
    }

    function parseFB2(xmlText) {
      const parser = new DOMParser(), doc = parser.parseFromString(xmlText, "application/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("FB2: ошибка XML");

      const binaries = {};
      for (const bin of doc.getElementsByTagName("binary")) {
        const id = bin.getAttribute("id"), type = bin.getAttribute("content-type") || "image/jpeg";
        if (id) binaries[id] = `data:${type};base64,${bin.textContent.replace(/\s+/g, "")}`;
      }
      const title = doc.getElementsByTagName("book-title")[0]?.textContent.trim() || BOOK.fallbackTitle;
      return { title, body: doc.getElementsByTagName("body")[0], binaries };
    }

    function renderElement(el, binaries, depth = 0) {
      const wrap = (tag, cls) => { const node = document.createElement(tag); if (cls) node.className = cls; appendChildren(node, el, binaries, depth + 1); return node; };
      switch (el.localName || el.tagName.toLowerCase()) {
        case "section": return wrap("section", "fb2-section");
        case "title": return wrap(depth <= 1 ? "h1" : "h2", "fb2-title");
        case "p": return wrap("p", "");
        case "emphasis": return wrap("em", "");
        case "strong": return wrap("strong", "");
        case "empty-line": return document.createElement("br");
        default: return wrap("span", "");
      }
    }

    function appendChildren(target, source, binaries, depth) {
      for (const child of source.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) target.appendChild(document.createTextNode(child.textContent));
        else if (child.nodeType === Node.ELEMENT_NODE) target.appendChild(renderElement(child, binaries, depth));
      }
    }

    // ============================================================
    // МУЛЬТИ-ЗАКЛАДКИ И СПИСКИ
    // ============================================================
    const BOOKMARKS_LIST_KEY = BOOK.storageKey + ".bookmarks_list";
    let bookmarksArray = JSON.parse(localStorage.getItem(BOOKMARKS_LIST_KEY)) || [];

    const openBookmarksBtn = $("openBookmarksBtn"), bookmarkMenu = $("bookmarkMenu"), closeBookmarkMenu = $("closeBookmarkMenu"), bmListEl = $("bookmarkList");
    const confirmDeleteModal = $("confirmDelete"), btnCancelDelete = $("btnCancelDelete"), btnConfirmDelete = $("btnConfirmDelete");
    let bookmarkToDelete = null;

    function saveBookmarksToStorage() {
      localStorage.setItem(BOOKMARKS_LIST_KEY, JSON.stringify(bookmarksArray));
      $("bmCount").textContent = bookmarksArray.length;
    }

    function assignBookmarkIds() {
      const blocks = contentEl.querySelectorAll("p, h1, h2, h3, h4, .fb2-title, .fb2-subtitle");
      blocks.forEach((el, i) => el.setAttribute("data-bm", String(i)));
    }

    function findBookmarkable(node) {
      let el = node && node.nodeType === Node.TEXT_NODE ? node.parentNode : node;
      while (el && el !== contentEl && el !== document.body) {
        if (el.nodeType === Node.ELEMENT_NODE && el.hasAttribute && el.hasAttribute("data-bm")) return el;
        el = el.parentNode;
      }
      return null;
    }

    function getTextOffsetInBlock(block, node, nodeOffset) {
      if (!block || !node) return -1;
      if (node.nodeType === Node.TEXT_NODE) {
        let acc = 0;
        const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
        let n;
        while ((n = walker.nextNode())) {
          if (n === node) return acc + nodeOffset;
          acc += n.textContent.length;
        }
        return -1;
      }
      const r = document.createRange(); r.selectNodeContents(block); r.setEnd(node, nodeOffset);
      return r.toString().length;
    }

    function locateInBlock(block, offset) {
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
      let acc = 0, n, lastNode = null;
      while ((n = walker.nextNode())) {
        lastNode = n;
        const len = n.textContent.length;
        if (acc + len >= offset) return { node: n, offset: Math.max(0, offset - acc) };
        acc += len;
      }
      if (lastNode) return { node: lastNode, offset: lastNode.textContent.length };
      return null;
    }

    function wrapRange(range, bmId) {
      const spans = [];
      const startContainer = range.startContainer, endContainer = range.endContainer;
      const startOffset = range.startOffset, endOffset = range.endOffset;
      const textNodes = [];
      
      const walker = document.createTreeWalker(
        range.commonAncestorContainer.nodeType === Node.TEXT_NODE ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer,
        NodeFilter.SHOW_TEXT,
        { acceptNode: (n) => { if (!n.textContent.length) return NodeFilter.FILTER_REJECT; return range.intersectsNode(n) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } }
      );
      
      let n;
      while ((n = walker.nextNode())) textNodes.push(n);
      if (textNodes.length === 0 && startContainer.nodeType === Node.TEXT_NODE) textNodes.push(startContainer);

      for (const node of textNodes) {
        const isStart = node === startContainer, isEnd = node === endContainer;
        let target = node;
        if (isStart && isEnd) {
          if (endOffset < node.textContent.length) node.splitText(endOffset);
          target = startOffset > 0 ? node.splitText(startOffset) : node;
        } else if (isEnd) {
          if (endOffset < node.textContent.length) node.splitText(endOffset);
          target = node;
        } else if (isStart) {
          target = startOffset > 0 ? node.splitText(startOffset) : node;
        }
        if (!target || !target.textContent || (target.parentNode && target.parentNode.classList && target.parentNode.classList.contains("bookmark-highlight"))) continue;

        const span = document.createElement("span");
        span.className = "bookmark-highlight";
        span.setAttribute("data-bmid", bmId);
        target.parentNode.insertBefore(span, target);
        span.appendChild(target);
        spans.push(span);
      }
      return spans;
    }

    function unwrapAllHighlights() {
      const spans = Array.from(contentEl.querySelectorAll(".bookmark-highlight"));
      const parents = new Set();
      for (const span of spans) {
        const p = span.parentNode;
        if (!p) continue;
        parents.add(p);
        while (span.firstChild) p.insertBefore(span.firstChild, span);
        p.removeChild(span);
      }
      for (const p of parents) p.normalize();
    }

    function applyAllBookmarksToDOM() {
      unwrapAllHighlights();
      // Чтобы не ломать оффсеты блоков, применяем закладки с конца книги к началу
      const sorted = [...bookmarksArray].sort((a, b) => parseInt(b.startBm) - parseInt(a.startBm) || b.startOffset - a.startOffset);
      
      sorted.forEach(bm => {
        const startBlock = contentEl.querySelector(`[data-bm="${CSS.escape(bm.startBm)}"]`);
        const endBlock = contentEl.querySelector(`[data-bm="${CSS.escape(bm.endBm)}"]`);
        if (!startBlock || !endBlock) return;

        const start = locateInBlock(startBlock, bm.startOffset), end = locateInBlock(endBlock, bm.endOffset);
        if (!start || !end) return;

        try {
          const range = document.createRange();
          range.setStart(start.node, start.offset); range.setEnd(end.node, end.offset);
          if (!range.collapsed) wrapRange(range, bm.id);
        } catch (e) {}
      });
      $("bmCount").textContent = bookmarksArray.length;
    }

    // Сохранение новой закладки
    bookmarkBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); });
    bookmarkBtn.addEventListener("mousedown", (e) => { e.preventDefault(); });
    bookmarkBtn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed || !contentEl.contains(sel.anchorNode)) return;

      const range = sel.getRangeAt(0);
      const startBlock = findBookmarkable(range.startContainer), endBlock = findBookmarkable(range.endContainer);
      if (!startBlock || !endBlock) return;

      const startBm = startBlock.getAttribute("data-bm"), endBm = endBlock.getAttribute("data-bm");
      const startOffset = getTextOffsetInBlock(startBlock, range.startContainer, range.startOffset);
      const endOffset = getTextOffsetInBlock(endBlock, range.endContainer, range.endOffset);
      if (startOffset < 0 || endOffset < 0) return;

      const textPreview = sel.toString().trim();
      
      const newBm = {
        id: Date.now().toString(),
        startBm, startOffset, endBm, endOffset,
        text: textPreview,
        date: new Date().toLocaleDateString("ru-RU") + " " + new Date().toLocaleTimeString("ru-RU", {hour: '2-digit', minute:'2-digit'})
      };

      bookmarksArray.push(newBm);
      saveBookmarksToStorage();
      
      sel.removeAllRanges();
      selectionToolbar.classList.remove("visible"); setTimeout(() => { selectionToolbar.hidden = true; }, 300);
      
      applyAllBookmarksToDOM();
      showToast("📍 Закладка добавлена!");

      // Пульсация новой закладки
      setTimeout(() => {
        const spans = contentEl.querySelectorAll(`.bookmark-highlight[data-bmid="${newBm.id}"]`);
        spans.forEach(s => s.classList.add("bookmark-pulse"));
        setTimeout(() => spans.forEach(s => s.classList.remove("bookmark-pulse")), 1700);
      }, 100);
    });

    // Окно управления закладками
    openBookmarksBtn.addEventListener("click", () => {
      bookmarkMenu.hidden = false;
      bmListEl.innerHTML = "";
      
      if (bookmarksArray.length === 0) {
        bmListEl.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">У вас пока нет закладок в этой книге. Выделите текст, чтобы создать.</div>`;
        return;
      }

      // Показываем в хронологическом порядке добавления (новые сверху)
      const reversed = [...bookmarksArray].reverse();
      reversed.forEach(bm => {
        const div = document.createElement("div"); div.className = "book-item";
        div.innerHTML = `
          <div style="flex:1; overflow:hidden; padding-right:15px;">
            <div class="bm-preview">"${bm.text}"</div>
            <div class="bm-date">${bm.date}</div>
          </div>
          <button class="bm-delete" aria-label="Удалить">🗑</button>
        `;
        
        // Клик по тексту перекидывает к закладке
        div.querySelector('.bm-preview').onclick = () => {
          bookmarkMenu.hidden = true;
          const target = contentEl.querySelector(`.bookmark-highlight[data-bmid="${bm.id}"]`);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            const spans = contentEl.querySelectorAll(`.bookmark-highlight[data-bmid="${bm.id}"]`);
            spans.forEach(s => s.classList.add("bookmark-pulse"));
            setTimeout(() => spans.forEach(s => s.classList.remove("bookmark-pulse")), 1700);
          }
        };

        // Кнопка удаления
        div.querySelector('.bm-delete').onclick = (e) => {
          e.stopPropagation();
          bookmarkToDelete = bm.id;
          confirmDeleteModal.hidden = false;
        };
        bmListEl.appendChild(div);
      });
    });
    closeBookmarkMenu.addEventListener("click", () => { bookmarkMenu.hidden = true; });

    // Окно подтверждения удаления
    btnCancelDelete.onclick = () => { confirmDeleteModal.hidden = true; bookmarkToDelete = null; };
    btnConfirmDelete.onclick = () => {
      if (bookmarkToDelete) {
        bookmarksArray = bookmarksArray.filter(b => b.id !== bookmarkToDelete);
        saveBookmarksToStorage();
        applyAllBookmarksToDOM();
        
        // Обновляем список сразу, если окно открыто
        if (!bookmarkMenu.hidden) openBookmarksBtn.click();
        showToast("Удалено");
      }
      confirmDeleteModal.hidden = true;
      bookmarkToDelete = null;
    };

    // Навигация по закладкам (Влево / Вправо)
    function jumpToNextBookmark(direction) {
      if (bookmarksArray.length === 0) return;
      const spans = Array.from(contentEl.querySelectorAll(".bookmark-highlight"));
      if (spans.length === 0) return;

      const viewportTop = window.scrollY;
      let targetSpan = null;

      if (direction === "next") {
        targetSpan = spans.find(span => span.getBoundingClientRect().top + window.scrollY > viewportTop + 50);
        if (!targetSpan) targetSpan = spans[0]; // По кругу
      } else {
        const reversedSpans = [...spans].reverse();
        targetSpan = reversedSpans.find(span => span.getBoundingClientRect().top + window.scrollY < viewportTop - 50);
        if (!targetSpan) targetSpan = reversedSpans[0];
      }

      if (targetSpan) {
        targetSpan.scrollIntoView({ behavior: "smooth", block: "center" });
        const bmId = targetSpan.getAttribute("data-bmid");
        const allSpans = contentEl.querySelectorAll(`.bookmark-highlight[data-bmid="${bmId}"]`);
        allSpans.forEach(s => s.classList.add("bookmark-pulse"));
        setTimeout(() => allSpans.forEach(s => s.classList.remove("bookmark-pulse")), 1700);
      }
    }
    $("prevBmBtn").onclick = () => jumpToNextBookmark("prev");
    $("nextBmBtn").onclick = () => jumpToNextBookmark("next");

    // ============================================================
    // Тулбар при выделении текста
    // ============================================================
    function handleSelectionChange() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed || !contentEl.contains(sel.getRangeAt(0).startContainer) || sel.toString().trim().length < 1) {
        selectionToolbar.classList.remove("visible");
        setTimeout(() => { if (!selectionToolbar.classList.contains("visible")) selectionToolbar.hidden = true; }, 280);
        return;
      }
      selectionToolbar.hidden = false;
      requestAnimationFrame(() => selectionToolbar.classList.add("visible"));
    }
    document.addEventListener("selectionchange", () => { setTimeout(handleSelectionChange, 120); });

    let toastT;
    function showToast(text) {
      toastText.textContent = text; toast.hidden = false;
      setTimeout(() => toast.classList.add("visible"), 10);
      clearTimeout(toastT); toastT = setTimeout(() => { toast.classList.remove("visible"); setTimeout(() => { toast.hidden = true; }, 300); }, 2000);
    }

    // Сохранение скролла
    let saveT;
    window.addEventListener("scroll", () => {
      clearTimeout(saveT);
      saveT = setTimeout(() => { localStorage.setItem(BOOK.storageKey + ".scroll", String(window.scrollY)); }, 300);
    }, { passive: true });

    // ============================================================
    // Загрузка
    // ============================================================
    async function loadBook() {
      try {
        const xmlText = await fetchBook();
        const book = parseFB2(xmlText);
        contentEl.innerHTML = "";
        
        const titleBlock = document.createElement("div"); titleBlock.className = "fb2-book-header";
        const h = document.createElement("h1"); h.className = "fb2-book-title"; h.textContent = book.title;
        titleBlock.appendChild(h); contentEl.appendChild(titleBlock);
        if (book.body) appendChildren(contentEl, book.body, book.binaries, 0);

        bookTitle.textContent = book.title;
        
        assignBookmarkIds();
        applyAllBookmarksToDOM();
        loadingEl.hidden = true;
        
        // Авто-возврат к последней позиции (или закладке)
        const savedY = parseInt(localStorage.getItem(BOOK.storageKey + ".scroll") || "0", 10);
        if (savedY > 0) {
          requestAnimationFrame(() => window.scrollTo(0, savedY));
        } else if (bookmarksArray.length > 0) {
          // Если мы еще не читали, но есть закладка - идем к самой свежей
          const lastBm = bookmarksArray[bookmarksArray.length - 1];
          const target = contentEl.querySelector(`.bookmark-highlight[data-bmid="${lastBm.id}"]`);
          if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
        }
      } catch (err) {
        console.error(err); loadingEl.hidden = true; errorEl.hidden = false;
        bookTitle.textContent = "Ошибка";
      }
    }
    loadBook();
  </script>
</body>
</html>

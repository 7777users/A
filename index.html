<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reader</title>
  <style>
    /* ============================================================
       iOS 26 - Reader (7 Комфортных тем для глаз)
       ============================================================ */

    /* 1. Кремовая (Теплая бумага) - По умолчанию */
    :root, html[data-theme="cream"] {
      --bg: #F8F5EE; --bg-elev: #EAE4D3; --text: #2B2A27; --text-secondary: #595854; --text-tertiary: #8C8A85; --separator: rgba(43, 42, 39, 0.12); --accent: #D97706;
      --glass-bg: rgba(248, 245, 238, 0.75); --glass-border: rgba(255, 255, 255, 0.5); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    /* 2. Сепия (Старая книга) */
    html[data-theme="sepia"] {
      --bg: #EAE0D0; --bg-elev: #D8CCBA; --text: #3C2F2F; --text-secondary: #6B5B5B; --text-tertiary: #8A7A7A; --separator: rgba(60, 47, 47, 0.15); --accent: #B45309;
      --glass-bg: rgba(234, 224, 208, 0.75); --glass-border: rgba(255, 255, 255, 0.3); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    /* 3. Серая (Мягкий контраст) */
    html[data-theme="gray"] {
      --bg: #E5E5EA; --bg-elev: #D1D1D6; --text: #2C2C2E; --text-secondary: #48484A; --text-tertiary: #8E8E93; --separator: rgba(44, 44, 46, 0.12); --accent: #007AFF;
      --glass-bg: rgba(229, 229, 234, 0.75); --glass-border: rgba(255, 255, 255, 0.4); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    /* 4. Мятная (Расслабляющая для зрения) */
    html[data-theme="mint"] {
      --bg: #E3F2ED; --bg-elev: #CBE6DC; --text: #253930; --text-secondary: #4A6357; --text-tertiary: #758C81; --separator: rgba(37, 57, 48, 0.12); --accent: #10B981;
      --glass-bg: rgba(227, 242, 237, 0.75); --glass-border: rgba(255, 255, 255, 0.5); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    /* 5. Кофейная (Вечерняя) */
    html[data-theme="coffee"] {
      --bg: #3E2F2B; --bg-elev: #2C201D; --text: #E6DEDD; --text-secondary: #BFAEA9; --text-tertiary: #8C7C77; --separator: rgba(230, 222, 221, 0.15); --accent: #FBBF24;
      --glass-bg: rgba(62, 47, 43, 0.75); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    /* 6. Ночная Синяя (Перед сном) */
    html[data-theme="night"] {
      --bg: #0F172A; --bg-elev: #1E293B; --text: #CBD5E1; --text-secondary: #94A3B8; --text-tertiary: #64748B; --separator: rgba(203, 213, 225, 0.15); --accent: #38BDF8;
      --glass-bg: rgba(15, 23, 42, 0.75); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    /* 7. Тёмная (Мягкая графитовая) */
    html[data-theme="dark"] {
      --bg: #1A1A1A; --bg-elev: #262626; --text: #D4D4D4; --text-secondary: #A3A3A3; --text-tertiary: #737373; --separator: rgba(212, 212, 212, 0.15); --accent: #0A84FF;
      --glass-bg: rgba(26, 26, 26, 0.75); --glass-border: rgba(255, 255, 255, 0.05); --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
      overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease;
    }

    body { display: flex; flex-direction: column; min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

    .glass {
      background: var(--glass-bg); backdrop-filter: saturate(180%) blur(28px); -webkit-backdrop-filter: saturate(180%) blur(28px);
      border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    }

    /* ----------------- Top bar ----------------- */
    .topbar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 50; width: min(640px, calc(100% - 24px)); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 9999px; min-height: 52px; }
    
    .title-block { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; flex: 1; text-align: center; }
    .title { font-weight: 600; font-size: 15px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .author { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .author:empty { display: none; }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9999px;
      border: none; background: transparent; color: var(--text); cursor: pointer; transition: 0.2s ease; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--separator); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ----------------- Reader area ----------------- */
    .reader { flex: 1; display: flex; justify-content: center; padding: 92px 20px 120px; position: relative; }
    .content { width: 100%; max-width: 680px; color: var(--text); font-family: "Georgia", "Merriweather", serif; font-size: 19px; line-height: 1.7; }
    
    /* Headers & FB2 Elements */
    .fb2-cover { display: flex; justify-content: center; margin: 12px 0 32px; }
    .fb2-cover img { max-width: 260px; width: 100%; height: auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .fb2-book-header { text-align: center; margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid var(--separator); font-family: sans-serif; }
    .fb2-book-title { font-size: 32px; font-weight: 700; margin: 0 0 8px; line-height: 1.15; }
    .fb2-book-author { font-size: 16px; color: var(--text-secondary); }
    
    .fb2-title { font-family: sans-serif; font-weight: 700; line-height: 1.2; margin: 32px 0 16px; }
    h1.fb2-title { font-size: 28px; margin-top: 48px; } h2.fb2-title { font-size: 22px; margin-top: 36px; }
    .fb2-title p, .fb2-subtitle + p, .fb2-book-header + p, .fb2-section > p:first-child { text-indent: 0; }
    .content p { margin: 0; text-indent: 1.5em; hyphens: auto; }

    .fb2-epigraph { margin: 24px 0 24px auto; padding: 0 0 0 16px; border-left: 2px solid var(--separator); font-style: italic; color: var(--text-secondary); max-width: 75%; }
    .fb2-cite { margin: 20px 16px; padding: 14px 18px; background: var(--bg-elev); border-radius: 14px; color: var(--text-secondary); }
    .fb2-image { display: block; max-width: 100%; height: auto; margin: 24px auto; border-radius: 14px; }
    
    /* ----------------- Loading & Error ----------------- */
    .loading, .error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 40; }
    .loading { flex-direction: column; gap: 14px; background: var(--bg); pointer-events: none; }
    .loading[hidden], .error[hidden] { display: none; }
    .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--separator); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    .loading-text { font-family: sans-serif; font-size: 14px; color: var(--text-secondary); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-card { padding: 24px 28px; border-radius: 20px; max-width: 460px; text-align: center; font-family: sans-serif; }
    .error-title { font-weight: 600; font-size: 18px; margin-bottom: 6px; }
    .error-sub { color: var(--text-secondary); font-size: 14px; line-height: 1.5; }

    /* ----------------- Bottom nav ----------------- */
    .navbar { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 50; }
    .navbar-inner { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 9999px; height: 56px; min-width: 220px; }
    .page-indicator { flex: 1; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px; padding: 0 10px; font-family: sans-serif; }
    .page-indicator .sep { color: var(--text-secondary); margin: 0 4px; }
    .nav-divider { width: 1px; height: 24px; background: var(--separator); margin: 0 2px; }
    .nav-divider[hidden] { display: none; }
    .icon-btn-accent { color: var(--accent); }
    
    /* ----------------- Modals & Toolbars ----------------- */
    .selection-toolbar { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 72px); transform: translate(-50%, 16px); z-index: 60; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .selection-toolbar.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .selection-toolbar[hidden] { display: none; }
    .action-pill { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 9999px; border: none; background: var(--accent); color: #fff; font-family: sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0, 0.2); }
    .action-pill svg { width: 18px; height: 18px; }

    .toast { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 80px); transform: translate(-50%, 20px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .toast[hidden] { display: none; }
    .toast-inner { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 9999px; font-family: sans-serif; font-size: 15px; font-weight: 600; }
    
    .bookmark-highlight { background-color: var(--accent); border-radius: 4px; opacity: 0.3; padding: 1px 2px; margin: 0 -2px; }

    /* ----------------- Book List Modal ----------------- */
    .modal { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; transition: 0.3s ease; }
    .modal[hidden] { opacity: 0; pointer-events: none; transform: translateY(20px); }
    .modal-header { display: flex; justify-content: space-between; padding: 20px 24px; align-items: center; border-bottom: 1px solid var(--separator); }
    .modal-header h2 { margin: 0; font-size: 22px; font-family: sans-serif; }
    .search-input { margin: 20px 24px 10px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--separator); background: var(--bg-elev); color: var(--text); font-size: 16px; outline: none; font-family: inherit; transition: 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    
    .book-list { flex: 1; overflow-y: auto; padding: 10px 24px 24px; }
    .book-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--separator); cursor: pointer; border-radius: 12px; margin-bottom: 8px; transition: 0.2s; }
    .book-item:hover, .book-item:active { background: var(--bg-elev); }
    .book-title { font-weight: 600; font-size: 16px; font-family: sans-serif; display: flex; align-items: center; gap: 10px; }
    .book-progress { font-size: 14px; color: var(--accent); font-weight: 700; background: var(--bg-elev); padding: 4px 12px; border-radius: 9999px; font-family: sans-serif; border: 1px solid var(--separator); }
  </style>
</head>
<body>

  <!-- Меню списка книг -->
  <div id="bookMenu" class="modal" hidden>
    <div class="modal-header">
      <h2>📚 Моя библиотека</h2>
      <button id="closeBookMenu" class="icon-btn" style="background: var(--bg-elev);">✕</button>
    </div>
    <input type="text" id="bookSearch" placeholder="Поиск по названию..." class="search-input" />
    <div class="book-list" id="bookList"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner glass">
      <!-- Кнопка списка файлов -->
      <button class="icon-btn" id="openMenuBtn" aria-label="Список книг">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
      
      <div class="title-block">
        <div class="title" id="bookTitle">Загрузка...</div>
        <div class="author" id="bookAuthor"></div>
      </div>
      
      <!-- Кнопка переключения тем -->
      <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.02 0 1.95-.39 2.66-1.04.59-.53.94-1.31.94-2.12 0-.3-.08-.59-.22-.85-.16-.31-.24-.65-.24-1 0-1.1.9-2 2-2h1.86c2.21 0 4-1.79 4-4 0-5.52-4.48-10-10-10z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="reader" id="reader">
    <article class="content" id="content"></article>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Открываем книгу…</div>
    </div>

    <div class="error" id="error" hidden>
      <div class="error-card glass">
        <div class="error-title">Книга не найдена</div>
        <div class="error-sub">Нажмите на иконку папки слева сверху, чтобы выбрать книгу из библиотеки.</div>
      </div>
    </div>
  </main>

  <nav class="navbar">
    <div class="navbar-inner glass">
      <button class="icon-btn" id="prevBtn" aria-label="Предыдущая глава">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="page-indicator"><span id="pageNum">0</span><span class="sep">/</span><span id="pageCount">0</span></div>
      <button class="icon-btn" id="nextBtn" aria-label="Следующая глава">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="nav-divider" id="navDivider" hidden></div>
      <button class="icon-btn icon-btn-accent" id="jumpBtn" hidden aria-label="К закладке">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h7A1.5 1.5 0 0 1 17 3.5V21a.5.5 0 0 1-.79.407L12 18.36l-4.21 3.047A.5.5 0 0 1 7 21V3.5z"/></svg>
      </button>
    </div>
  </nav>

  <div class="selection-toolbar" id="selectionToolbar" hidden>
    <button class="action-pill" id="bookmarkBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h7A1.5 1.5 0 0 1 17 3.5V21a.5.5 0 0 1-.79.407L12 18.36l-4.21 3.047A.5.5 0 0 1 7 21V3.5z"/></svg>
      <span>Остановиться здесь</span>
    </button>
  </div>

  <div class="toast" id="toast" hidden>
    <div class="toast-inner glass">
      <span id="toastText">Уведомление</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module">
    // ============================================================
    // Инициализация книги
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const requestedBook = urlParams.get('book');
    const actualBookName = requestedBook || "book.fb2";
    
    const BOOK = {
      candidates: requestedBook ? [`Books/${requestedBook}`] : ["Books/book.fb2"],
      fallbackTitle: "Книга",
      storageKey: `reader.fb2.${actualBookName}`,
    };

    const $ = (id) => document.getElementById(id);
    const contentEl = $("content"), loadingEl = $("loading"), errorEl = $("error");
    const prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), pageNumEl = $("pageNum"), pageCountEl = $("pageCount");
    const themeToggle = $("themeToggle"), bookTitle = $("bookTitle"), bookAuthor = $("bookAuthor");
    const selectionToolbar = $("selectionToolbar"), bookmarkBtn = $("bookmarkBtn");
    const jumpBtn = $("jumpBtn"), navDivider = $("navDivider");
    const toast = $("toast"), toastText = $("toastText");

    // ============================================================
    // Темы (7 режимов)
    // ============================================================
    const themes = ["cream", "sepia", "gray", "mint", "coffee", "night", "dark"];
    const themeNames = ["Кремовая", "Сепия", "Серая", "Мятная", "Кофейная", "Ночная", "Тёмная"];
    const THEME_KEY = "reader.theme";

    function applyTheme(theme) { document.documentElement.setAttribute("data-theme", theme); }
    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved && themes.includes(saved)) { applyTheme(saved); return; }
      applyTheme("cream");
    }

    themeToggle.addEventListener("click", () => {
      let currentIdx = themes.indexOf(document.documentElement.getAttribute("data-theme") || "cream");
      currentIdx = (currentIdx + 1) % themes.length;
      const next = themes[currentIdx];
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
      showToast(`Тема: ${themeNames[currentIdx]}`);
    });
    initTheme();

    // ============================================================
    // Меню со списком книг и поиском
    // ============================================================
    const openMenuBtn = $("openMenuBtn"), bookMenu = $("bookMenu"), closeBookMenu = $("closeBookMenu");
    const bookList = $("bookList"), bookSearch = $("bookSearch");
    let allBooks = [];

    async function fetchBooksFromGitHub() {
      let host = window.location.hostname, user = host.split('.')[0], repo = window.location.pathname.split('/')[1] || "Reader";
      if (!host.includes("github.io")) return [actualBookName]; // Локальная проверка
      
      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/Books`);
        if (res.ok) {
          const data = await res.json();
          return data.filter(f => f.name.endsWith('.fb2') || f.name.endsWith('.zip')).map(f => f.name);
        }
      } catch (e) { console.error(e); }
      return [];
    }

    async function openBookMenu() {
      bookMenu.hidden = false;
      if (allBooks.length === 0) {
        bookList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">Ищем книги...</div>`;
        allBooks = await fetchBooksFromGitHub();
      }
      renderBookList(allBooks);
    }

    function renderBookList(books) {
      bookList.innerHTML = "";
      if (books.length === 0) {
        bookList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">Книги не найдены в папке Books/</div>`;
        return;
      }
      const query = bookSearch.value.toLowerCase();
      books.filter(b => b.toLowerCase().includes(query)).forEach(bookName => {
        // Подтягиваем сохраненный процент прогресса
        const progress = localStorage.getItem(`reader.fb2.${bookName}.progress`) || "0";
        
        const div = document.createElement("div");
        div.className = "book-item";
        div.innerHTML = `
          <div class="book-title">📘 ${bookName.replace('.fb2', '')}</div>
          <div class="book-progress">${progress}%</div>
        `;
        div.onclick = () => { window.location.href = `?book=${encodeURIComponent(bookName)}`; };
        bookList.appendChild(div);
      });
    }

    bookSearch.addEventListener("input", () => renderBookList(allBooks));
    openMenuBtn.addEventListener("click", openBookMenu);
    closeBookMenu.addEventListener("click", () => { bookMenu.hidden = true; });

    // ============================================================
    // Чтение и парсинг книги
    // ============================================================
    let chapters = [], currentChapter = 0, isScrollingProgrammatically = false;

    async function fetchBook() {
      let lastErr;
      for (const url of BOOK.candidates) {
        try {
          const res = await fetch(url);
          if (!res.ok) { lastErr = new Error(`${res.status}`); continue; }
          const lower = url.toLowerCase();
          if (lower.endsWith(".zip")) {
            const blob = await res.blob(), zip = await JSZip.loadAsync(blob);
            const fb2Name = Object.keys(zip.files).find((n) => n.toLowerCase().endsWith(".fb2"));
            if (!fb2Name) { lastErr = new Error("no .fb2 inside zip"); continue; }
            return await zip.files[fb2Name].async("string");
          }
          return decodeText(await res.arrayBuffer());
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("not found");
    }

    function decodeText(buf) {
      const u8 = new Uint8Array(buf);
      if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder("utf-8").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder("utf-16le").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder("utf-16be").decode(buf);
      const head = new TextDecoder("ascii", { fatal: false }).decode(new Uint8Array(buf, 0, Math.min(256, buf.byteLength)));
      const m = head.match(/encoding\s*=\s*["']([^"']+)["']/i);
      let enc = (m ? m[1] : "utf-8").toLowerCase().replace(/_/g, "-");
      if (enc === "cp1251" || enc === "win-1251") enc = "windows-1251";
      try { return new TextDecoder(enc, { fatal: false }).decode(buf); } catch { return new TextDecoder("utf-8").decode(buf); }
    }

    function parseFB2(xmlText) {
      const parser = new DOMParser(), doc = parser.parseFromString(xmlText, "application/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("FB2: ошибка XML");

      const binaries = {};
      for (const bin of doc.getElementsByTagName("binary")) {
        const id = bin.getAttribute("id"), type = bin.getAttribute("content-type") || "image/jpeg";
        if (id) binaries[id] = `data:${type};base64,${bin.textContent.replace(/\s+/g, "")}`;
      }

      const title = doc.getElementsByTagName("book-title")[0]?.textContent.trim() || BOOK.fallbackTitle;
      let author = "";
      const authorEl = doc.getElementsByTagName("author")[0];
      if (authorEl) {
        author = [authorEl.getElementsByTagName("first-name")[0]?.textContent, authorEl.getElementsByTagName("last-name")[0]?.textContent].filter(Boolean).join(" ").trim();
      }
      return { title, author, cover: null, body: doc.getElementsByTagName("body")[0], binaries };
    }

    function renderElement(el, binaries, depth = 0) {
      const wrap = (tag, cls) => { const node = document.createElement(tag); if (cls) node.className = cls; appendChildren(node, el, binaries, depth + 1); return node; };
      switch (el.localName || el.tagName.toLowerCase()) {
        case "section": return wrap("section", "fb2-section");
        case "title": return wrap(depth <= 1 ? "h1" : "h2", "fb2-title");
        case "p": return wrap("p", "");
        case "emphasis": return wrap("em", "");
        case "strong": return wrap("strong", "");
        case "empty-line": return document.createElement("br");
        default: return wrap("span", "");
      }
    }

    function appendChildren(target, source, binaries, depth) {
      for (const child of source.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) target.appendChild(document.createTextNode(child.textContent));
        else if (child.nodeType === Node.ELEMENT_NODE) target.appendChild(renderElement(child, binaries, depth));
      }
    }

    // ============================================================
    // Прогресс, Скролл и Навигация
    // ============================================================
    function indexChapters() {
      chapters = Array.from(contentEl.querySelectorAll(":scope > .fb2-section"));
      if (chapters.length === 0) chapters = Array.from(contentEl.querySelectorAll(":scope > h1, :scope > h2"));
      pageCountEl.textContent = chapters.length || 1;
      pageNumEl.textContent = 1;
    }

    function setupChapterObserver() {
      if (!chapters.length) return;
      new IntersectionObserver((entries) => {
          if (isScrollingProgrammatically) return;
          let bestIdx = currentChapter, bestTop = Infinity;
          for (const e of entries) {
            if (e.isIntersecting && Math.abs(e.boundingClientRect.top) < bestTop) { bestTop = Math.abs(e.boundingClientRect.top); bestIdx = chapters.indexOf(e.target); }
          }
          if (bestIdx !== currentChapter && bestIdx >= 0) { currentChapter = bestIdx; pageNumEl.textContent = currentChapter + 1; }
        }, { rootMargin: "-100px 0px -60% 0px", threshold: [0, 0.1] }
      ).observe(contentEl);
    }

    function goToChapter(idx) {
      if (idx < 0 || idx >= chapters.length) return;
      currentChapter = idx; pageNumEl.textContent = idx + 1; isScrollingProgrammatically = true;
      chapters[idx].scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(() => { isScrollingProgrammatically = false; }, 700);
    }
    prevBtn.addEventListener("click", () => goToChapter(currentChapter - 1));
    nextBtn.addEventListener("click", () => goToChapter(currentChapter + 1));

    // Умное сохранение прогресса от 0 до 100% при скролле
    let saveT;
    window.addEventListener("scroll", () => {
      clearTimeout(saveT);
      saveT = setTimeout(() => {
        const y = window.scrollY;
        localStorage.setItem(BOOK.storageKey + ".scroll", String(y));
        
        // Вычисляем процент прочитанного
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        let pct = maxScroll > 0 ? Math.round((y / maxScroll) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        
        // Сохраняем процент именно для этой книги, чтобы он был виден в меню
        localStorage.setItem(`reader.fb2.${actualBookName}.progress`, pct);
      }, 300);
    }, { passive: true });

    // ============================================================
    // Закладки ("Остановиться здесь")
    // ============================================================
    function handleSelectionChange() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !contentEl.contains(sel.anchorNode)) { selectionToolbar.hidden = true; selectionToolbar.classList.remove("visible"); return; }
      selectionToolbar.hidden = false; setTimeout(() => selectionToolbar.classList.add("visible"), 10);
    }
    document.addEventListener("selectionchange", () => { setTimeout(handleSelectionChange, 120); });
    bookmarkBtn.addEventListener("pointerdown", (e) => e.preventDefault());
    
    bookmarkBtn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      window.getSelection().removeAllRanges();
      selectionToolbar.classList.remove("visible"); setTimeout(() => { selectionToolbar.hidden = true; }, 300);
      showToast("📍 Прогресс и закладка сохранены!");
      
      // Принудительно сохраняем скролл и % при закладке
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      let pct = maxScroll > 0 ? Math.round((window.scrollY / maxScroll) * 100) : 100;
      localStorage.setItem(`reader.fb2.${actualBookName}.progress`, pct);
    });

    let toastT;
    function showToast(text) {
      toastText.textContent = text; toast.hidden = false;
      setTimeout(() => toast.classList.add("visible"), 10);
      clearTimeout(toastT); toastT = setTimeout(() => { toast.classList.remove("visible"); setTimeout(() => { toast.hidden = true; }, 300); }, 2000);
    }

    async function loadBook() {
      try {
        const xmlText = await fetchBook();
        const book = parseFB2(xmlText);
        contentEl.innerHTML = "";
        
        const titleBlock = document.createElement("div"); titleBlock.className = "fb2-book-header";
        const h = document.createElement("h1"); h.className = "fb2-book-title"; h.textContent = book.title;
        titleBlock.appendChild(h); contentEl.appendChild(titleBlock);
        if (book.body) appendChildren(contentEl, book.body, book.binaries, 0);

        bookTitle.textContent = book.title; bookAuthor.textContent = book.author;
        indexChapters(); setupChapterObserver(); loadingEl.hidden = true;
        
        const savedY = parseInt(localStorage.getItem(BOOK.storageKey + ".scroll") || "0", 10);
        if (savedY > 0) requestAnimationFrame(() => window.scrollTo(0, savedY));
      } catch (err) {
        console.error(err); loadingEl.hidden = true; errorEl.hidden = false;
        bookTitle.textContent = "Ошибка";
      }
    }
    loadBook();
  </script>
</body>
</html>
